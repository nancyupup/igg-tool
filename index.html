<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IGG Referral Tracker</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px;
    background: #f5f7fa;
    color: #1f2937;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        Arial,
        sans-serif;
}

.container {
    max-width: 1600px;
    margin: 0 auto;
}

h1 {
    margin: 0 0 25px;
    font-size: 30px;
    color: #111827;
}

h2 {
    margin: 0 0 18px;
    font-size: 20px;
    color: #111827;
}

.card {
    background: #fff;
    border-radius: 12px;
    padding: 22px;
    margin-bottom: 22px;
    box-shadow: 0 2px 10px rgba(0,0,0,.05);
}

.form-row {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
}

.form-row label {
    font-size: 14px;
    color: #4b5563;
}

input[type="date"] {
    padding: 10px 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
    background: #fff;
}

textarea {
    width: 100%;
    min-height: 250px;
    margin-top: 15px;
    padding: 14px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    resize: vertical;
    font-family: monospace;
    font-size: 13px;
    line-height: 1.6;
}

button {
    border: 0;
    border-radius: 8px;
    padding: 10px 16px;
    cursor: pointer;
    font-size: 14px;
    background: #111827;
    color: #fff;
}

button:hover {
    opacity: .88;
}

button.secondary {
    background: #6b7280;
}

button.danger {
    background: #dc2626;
}

/* =========================
   数据概览
   ========================= */

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
}

.stat {
    padding: 18px;
    background: #f8fafc;
    border-radius: 10px;
}

.stat-label {
    font-size: 13px;
    color: #6b7280;
    margin-bottom: 8px;
}

.stat-value {
    font-size: 24px;
    font-weight: 700;
    color: #111827;
}

/* =========================
   通用表格
   ========================= */

.table-wrap {
    width: 100%;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 700px;
}

th,
td {
    padding: 12px 10px;
    border-bottom: 1px solid #e5e7eb;
    text-align: right;
    white-space: nowrap;
}

th {
    background: #f8fafc;
    color: #4b5563;
    font-size: 13px;
    font-weight: 600;
}

th:first-child,
td:first-child {
    text-align: left;
}

td {
    font-size: 14px;
}

.empty {
    padding: 30px !important;
    text-align: center !important;
    color: #9ca3af;
}

.section-note {
    color: #6b7280;
    font-size: 13px;
    margin-top: -8px;
    margin-bottom: 15px;
}

/* =========================
   数字颜色
   ========================= */

.change-up {
    color: #15803d;
    font-weight: 700;
}

.change-down {
    color: #dc2626;
    font-weight: 700;
}

.positive {
    color: #15803d;
}

.negative {
    color: #dc2626;
}

.muted {
    color: #9ca3af;
}

/* =========================
   渠道表现
   ========================= */

.channel-table th {
    text-align: center;
}

.channel-table th:first-child {
    text-align: left;
}

.channel-table td {
    text-align: center;
}

.channel-table td:first-child {
    text-align: left;
}

.channel-title {
    font-weight: 600;
}

/* =========================
   渠道每日新增
   ========================= */

.daily-channel-wrap {
    width: 100%;
    overflow: auto;
    max-height: 650px;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
}

.daily-channel-table {
    width: max-content;
    min-width: 100%;
    border-collapse: separate;
    border-spacing: 0;
}

.daily-channel-table th {
    position: sticky;
    top: 0;
    z-index: 4;
    background: #f8fafc;
    text-align: center;
    min-width: 130px;
}

.daily-channel-table th:first-child {
    left: 0;
    z-index: 6;
    min-width: 220px;
    text-align: left;
}

.daily-channel-table td {
    min-width: 130px;
    text-align: center;
    height: 55px;
}

.daily-channel-table td:first-child {
    position: sticky;
    left: 0;
    z-index: 3;
    background: #fff;
    min-width: 220px;
    text-align: left;
    font-weight: 600;
}

/* =========================
   Referral 每日变化
   ========================= */

.referral-daily-wrap {
    width: 100%;
    max-height: 720px;
    overflow: auto;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
}

.referral-daily-table {
    width: max-content;
    min-width: 100%;
    border-collapse: separate;
    border-spacing: 0;
}

.referral-daily-table th,
.referral-daily-table td {
    border-right: 1px solid #e5e7eb;
    border-bottom: 1px solid #e5e7eb;
}

.referral-daily-table th {
    position: sticky;
    top: 0;
    z-index: 4;
    min-width: 145px;
    height: 52px;
    background: #f8fafc;
    text-align: center;
    color: #6b7280;
    font-size: 14px;
    font-weight: 700;
}

.referral-daily-table th:first-child {
    position: sticky;
    left: 0;
    top: 0;
    z-index: 7;
    min-width: 360px;
    text-align: left;
    background: #f8fafc;
}

.referral-daily-table td {
    position: relative;
    min-width: 145px;
    height: 54px;
    padding: 0 14px;
    text-align: center;
    font-size: 16px;
    font-weight: 700;
}

.referral-daily-table td:first-child {
    position: sticky;
    left: 0;
    z-index: 3;
    min-width: 360px;
    max-width: 360px;
    background: #fff;
    text-align: left;
    font-family: monospace;
    font-weight: 600;
}

.referral-name {
    max-width: 330px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.referral-daily-positive {
    background: #edf7ef;
    color: #15803d;
}

.referral-daily-negative {
    background: #fceaea;
    color: #dc2626;
}

.referral-daily-zero {
    background: #fff;
    color: #cbd5e1;
    font-weight: 400 !important;
}

.referral-new-cell {
    border: 2px dashed #f3a6c5 !important;
}

.referral-new::after {
    content: "NEW";
    position: absolute;
    top: 0;
    right: 0;
    padding: 4px 7px;
    background: #ec1675;
    color: #fff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    font-size: 11px;
    line-height: 1;
    font-weight: 700;
}

/* =========================
   历史
   ========================= */

.history-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 13px 0;
    border-bottom: 1px solid #e5e7eb;
}

.history-item:last-child {
    border-bottom: 0;
}

.small {
    font-size: 12px;
    color: #6b7280;
    margin-top: 4px;
}

/* =========================
   Responsive
   ========================= */

@media (max-width: 900px) {

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .referral-daily-table th:first-child,
    .referral-daily-table td:first-child {
        min-width: 260px;
        max-width: 260px;
    }

    .referral-daily-table th,
    .referral-daily-table td {
        min-width: 120px;
    }
}

@media (max-width: 600px) {

    body {
        padding: 15px;
    }

    .stats {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>IGG Referral Tracker</h1>

    <!-- 数据导入 -->

    <div class="card">

        <h2>数据导入</h2>

        <div class="form-row">

            <label for="snapshotDate">
                数据日期：
            </label>

            <input
                type="date"
                id="snapshotDate"
            >

            <button onclick="importData()">
                导入数据
            </button>

            <button
                class="secondary"
                onclick="loadDemo()"
            >
                加载示例
            </button>

            <button
                class="danger"
                onclick="clearHistory()"
            >
                清空历史
            </button>

        </div>

        <textarea
            id="rawData"
            placeholder="请粘贴 IGG Referral Links 数据"
        ></textarea>

    </div>


    <!-- 数据概览 -->

    <div class="card">

        <h2>数据概览</h2>

        <div class="stats">

            <div class="stat">

                <div class="stat-label">
                    最新累计销售额
                </div>

                <div
                    class="stat-value"
                    id="latestRevenue"
                >
                    $0
                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    最新累计订单
                </div>

                <div
                    class="stat-value"
                    id="latestOrders"
                >
                    0
                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    今日新增销售额
                </div>

                <div
                    class="stat-value"
                    id="todayRevenue"
                >
                    $0
                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    今日新增订单
                </div>

                <div
                    class="stat-value"
                    id="todayOrders"
                >
                    0
                </div>

            </div>

        </div>

    </div>


    <!-- 每日新增看板 -->

    <div class="card">

        <h2>每日新增看板</h2>

        <div class="section-note">
            每日新增 = 当天累计数据 − 上一次快照累计数据；销售/订单变化仅显示增加，不显示负数。
        </div>

        <div class="table-wrap">

            <table>

                <thead>

                    <tr>
                        <th>日期</th>
                        <th>销售</th>
                        <th>销售变化</th>
                        <th>订单</th>
                        <th>订单变化</th>
                    </tr>

                </thead>

                <tbody id="dailyBoardBody"></tbody>

            </table>

        </div>

    </div>


    <!-- 渠道表现 -->

    <div class="card">

        <h2>渠道表现</h2>

        <div class="section-note">
            销售额为 0、没有带量的渠道不显示
        </div>

        <div class="table-wrap">

            <table class="channel-table">

                <thead>

                    <tr>
                        <th>渠道</th>
                        <th>累计订单</th>
                        <th>累计销售额</th>
                        <th>今日新增订单</th>
                        <th>今日新增销售额</th>
                    </tr>

                </thead>

                <tbody id="channelBody"></tbody>

            </table>

        </div>

    </div>


    <!-- 渠道每日新增 -->

    <div class="card">

        <h2>渠道每日新增</h2>

        <div class="section-note">
            每个日期显示该渠道当天实际新增销售额及订单；累计数据没有变化时显示 0。
        </div>

        <div class="daily-channel-wrap">

            <table class="daily-channel-table">

                <thead id="channelDailyHead"></thead>

                <tbody id="channelDailyBody"></tbody>

            </table>

        </div>

    </div>


    <!-- Referral 明细 -->

    <div class="card">

        <h2>Referral 明细</h2>

        <div class="section-note">
            行 = Link，列 = 快照日期；单元格 = 当日销售变化
        </div>

        <div class="referral-daily-wrap">

            <table class="referral-daily-table">

                <thead id="referralDailyHead"></thead>

                <tbody id="referralDailyBody"></tbody>

            </table>

        </div>

    </div>


    <!-- 历史数据 -->

    <div class="card">

        <h2>历史数据</h2>

        <div id="historyBody"></div>

    </div>

</div>


<script>

/* =========================================================
   基础
   ========================================================= */

const STORAGE_KEY =
    "igg_referral_snapshots";


/* =========================================================
   LocalStorage
   ========================================================= */

function getSnapshots() {

    try {

        const data =
            JSON.parse(
                localStorage.getItem(
                    STORAGE_KEY
                )
            );

        return Array.isArray(data)
            ? data
            : [];

    } catch (error) {

        return [];
    }
}


function saveSnapshots(
    snapshots
) {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(snapshots)
    );
}


/* =========================================================
   格式化
   ========================================================= */

function money(value) {

    const n =
        Number(value || 0);

    return new Intl.NumberFormat(
        "en-US",
        {
            style: "currency",
            currency: "USD",
            minimumFractionDigits: 0,
            maximumFractionDigits: 2
        }
    ).format(n);
}


function number(value) {

    return Number(value || 0)
        .toLocaleString("en-US");
}


function signedMoney(value) {

    const n =
        Number(value || 0);

    if (n > 0) {

        return "+" + money(n);
    }

    if (n < 0) {

        return "-$" +
            Math.abs(n)
                .toLocaleString(
                    "en-US",
                    {
                        minimumFractionDigits: 0,
                        maximumFractionDigits: 2
                    }
                );
    }

    return "$0";
}


function signedNumber(value) {

    const n =
        Number(value || 0);

    if (n > 0) {

        return "+" + number(n);
    }

    if (n < 0) {

        return "-" +
            number(
                Math.abs(n)
            );
    }

    return "0";
}


function escapeHtml(str) {

    return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function parseMoney(value) {

    if (
        value === undefined ||
        value === null ||
        value === ""
    ) {

        return 0;
    }

    const text =
        String(value)
            .trim()
            .replace(/,/g, "")
            .replace(/\$/g, "")
            .replace(/HK\$/gi, "")
            .replace(/US\$/gi, "");


    const match =
        text.match(
            /-?\d+(?:\.\d+)?/
        );


    if (!match) {

        return 0;
    }


    return Number(match[0]) || 0;
}


/* =========================================================
   防止浮点误差
   ========================================================= */

function cleanNumber(value) {

    const n =
        Number(value || 0);

    if (
        Math.abs(n) < 0.000001
    ) {

        return 0;
    }

    return n;
}


/* =========================================================
   渠道分类
   ========================================================= */

function classifyChannel(name) {

    const n =
        String(name || "")
            .trim()
            .toLowerCase();


    if (
        n.startsWith("gg_plat") ||
        n.startsWith("gg-plat") ||
        n.startsWith("gg_ads") ||
        n.startsWith("gg-ads") ||
        n === "ggads" ||
        n.startsWith("google_ads") ||
        n.startsWith("google-ads") ||
        n.startsWith("google ads") ||
        n.startsWith("googleads")
    ) {

        return "Google Ads";
    }


    if (
        n.startsWith("meta_") ||
        n.startsWith("meta-") ||
        n.startsWith("meta ads") ||
        n.startsWith("metaads") ||
        n === "meta"
    ) {

        return "Meta Ads";
    }


    if (
        n === "hoverair.com"
    ) {

        return "hoverair.com";
    }


    if (
        n.startsWith("fb-group") ||
        n.startsWith("fb_group") ||
        n.startsWith("fb group") ||
        n.startsWith("facebook-group") ||
        n.startsWith("facebook_group") ||
        n.startsWith("facebook group") ||
        n.includes("fb-group")
    ) {

        return "FB Group";
    }


    if (
        n.includes("social media")
    ) {

        return "Social Media";
    }


    if (
        n === "facebook" ||
        n.startsWith("facebook/")
    ) {

        return "Facebook";
    }


    if (
        n === "instagram" ||
        n.startsWith("instagram/")
    ) {

        return "Instagram";
    }


    if (
        n === "reddit" ||
        n.startsWith("reddit/")
    ) {

        return "Reddit";
    }


    if (
        n === "x" ||
        n === "twitter" ||
        n.includes("twitter") ||
        n.includes("x.com")
    ) {

        return "X/Twitter";
    }


    if (
        n.startsWith("pr-") ||
        n.startsWith("pr_") ||
        n.startsWith("pr ") ||
        n === "pr"
    ) {

        return "PR";
    }


    if (
        n.startsWith("igg_") ||
        n.startsWith("igg-") ||
        n.startsWith("igg ") ||
        n.includes("igg newsletter") ||
        n.includes("igg-dedicated") ||
        n.includes("igg_dedicated")
    ) {

        return "IGG Newsletter";
    }


    if (
        n.startsWith("edm") ||
        n.includes("edm-") ||
        n.includes("edm_")
    ) {

        return "EDM";
    }


    if (
        n.includes("ifa") ||
        n.includes("event")
    ) {

        return "IFA/Event";
    }


    if (
        n.startsWith("update") ||
        n.includes("update-") ||
        n.includes("update_")
    ) {

        return "Update";
    }


    return "Other";
}


/* =========================================================
   解析 Referral
   ========================================================= */

function parseReferralText(raw) {

    const lines =
        raw
            .split(/\r?\n/)
            .map(
                line => line.trim()
            )
            .filter(Boolean);


    const referrals = [];


    let i = 0;


    while (
        i + 6 < lines.length
    ) {

        const name =
            lines[i];

        const status =
            lines[i + 1];

        const ordersText =
            lines[i + 2];

        const oneDayText =
            lines[i + 3];

        const sevenDayText =
            lines[i + 4];

        const incomeText =
            lines[i + 5];

        const totalText =
            lines[i + 6];


        const orders =
            Number(
                String(ordersText)
                    .replace(/,/g, "")
                    .replace(/[^\d.-]/g, "")
            ) || 0;


        const oneDay =
            parseMoney(
                oneDayText
            );


        const sevenDay =
            parseMoney(
                sevenDayText
            );


        const income =
            parseMoney(
                incomeText
            );


        const total =
            parseMoney(
                totalText
            );


        if (
            name &&
            !/^(status|orders|one day|7 days|income|total)$/i
                .test(name)
        ) {

            referrals.push({

                name,
                status,
                orders,
                oneDay,
                sevenDay,
                income,
                total
            });


            i += 7;

        } else {

            i++;
        }
    }


    return referrals;
}


/* =========================================================
   Snapshot
   ========================================================= */

function getSortedSnapshots(
    snapshots
) {

    return [...snapshots]
        .sort(
            (a, b) =>
                String(a.date)
                    .localeCompare(
                        String(b.date)
                    )
        );
}


function getLatestSnapshot(
    snapshots
) {

    const sorted =
        getSortedSnapshots(
            snapshots
        );


    return sorted.length
        ? sorted[sorted.length - 1]
        : null;
}


function getPreviousSnapshot(
    snapshots,
    project,
    date
) {

    const previous =
        snapshots
            .filter(
                item =>
                    item.project === project &&
                    item.date < date
            )
            .sort(
                (a, b) =>
                    a.date.localeCompare(
                        b.date
                    )
            );


    return previous.length
        ? previous[previous.length - 1]
        : null;
}


/* =========================================================
   核心：
   每日新增 = 累计 - 上一次累计
   ========================================================= */

function calculateDaily(
    currentReferral,
    previousReferral
) {

    if (!currentReferral) {

        return {
            revenue: 0,
            orders: 0
        };
    }


    const currentRevenue =
        Number(
            currentReferral.total || 0
        );


    const currentOrders =
        Number(
            currentReferral.orders || 0
        );


    const previousRevenue =
        previousReferral
            ? Number(
                previousReferral.total || 0
            )
            : 0;


    const previousOrders =
        previousReferral
            ? Number(
                previousReferral.orders || 0
            )
            : 0;


    let revenue =
        currentRevenue -
        previousRevenue;


    let orders =
        currentOrders -
        previousOrders;


    revenue =
        cleanNumber(revenue);


    orders =
        cleanNumber(orders);


    /*
     * 重要：
     *
     * 正常情况下累计数据应该只增不减。
     *
     * 如果因为 IGG 数据刷新、Link 状态变化、
     * 历史数据异常等原因出现负数，
     * 每日新增按照 0 处理。
     *
     * 这样每日新增看板不会出现负数。
     */

    if (revenue < 0) {

        revenue = 0;
    }


    if (orders < 0) {

        orders = 0;
    }


    return {
        revenue,
        orders
    };
}


/* =========================================================
   某个 Referral 某一天新增
   ========================================================= */

function getReferralDaily(
    snapshot,
    referralName,
    snapshots
) {

    if (!snapshot) {

        return {
            revenue: 0,
            orders: 0
        };
    }


    const currentReferral =
        snapshot.referrals.find(
            item =>
                item.name === referralName
        );


    if (!currentReferral) {

        return {
            revenue: 0,
            orders: 0
        };
    }


    const previousSnapshot =
        getPreviousSnapshot(
            snapshots,
            snapshot.project,
            snapshot.date
        );


    const previousReferral =
        previousSnapshot?.referrals?.find(
            item =>
                item.name === referralName
        );


    return calculateDaily(
        currentReferral,
        previousReferral
    );
}


/* =========================================================
   Snapshot 每日总新增
   ========================================================= */

function getSnapshotDailyTotal(
    snapshot,
    snapshots
) {

    if (!snapshot) {

        return {
            revenue: 0,
            orders: 0
        };
    }


    const previousSnapshot =
        getPreviousSnapshot(
            snapshots,
            snapshot.project,
            snapshot.date
        );


    let revenue = 0;
    let orders = 0;


    snapshot.referrals.forEach(
        currentReferral => {

            const previousReferral =
                previousSnapshot?.referrals?.find(
                    item =>
                        item.name ===
                        currentReferral.name
                );


            const daily =
                calculateDaily(
                    currentReferral,
                    previousReferral
                );


            revenue +=
                daily.revenue;


            orders +=
                daily.orders;
        }
    );


    return {
        revenue:
            cleanNumber(revenue),
        orders:
            cleanNumber(orders)
    };
}


/* =========================================================
   导入数据
   ========================================================= */

function importData() {

    const date =
        document.getElementById(
            "snapshotDate"
        ).value;


    const raw =
        document.getElementById(
            "rawData"
        ).value.trim();


    if (!date) {

        alert(
            "请选择数据日期"
        );

        return;
    }


    if (!raw) {

        alert(
            "请粘贴 IGG Referral 数据"
        );

        return;
    }


    const referrals =
        parseReferralText(raw);


    if (!referrals.length) {

        alert(
            "没有识别到有效 Referral 数据，请检查数据格式。"
        );

        return;
    }


    let snapshots =
        getSnapshots();


    const snapshot = {

        project: "default",

        date,

        referrals
    };


    /*
     * 同一天重新上传：
     * 直接覆盖旧数据。
     */

    const existingIndex =
        snapshots.findIndex(
            item =>
                item.project === "default" &&
                item.date === date
        );


    if (
        existingIndex >= 0
    ) {

        snapshots[
            existingIndex
        ] = snapshot;

    } else {

        snapshots.push(snapshot);
    }


    snapshots =
        getSortedSnapshots(
            snapshots
        );


    saveSnapshots(
        snapshots
    );


    renderAll();


    alert(
        `导入成功：${date}\n识别到 ${referrals.length} 个 Referral`
    );
}


/* =========================================================
   渠道数据
   ========================================================= */

function buildChannelData(
    latest,
    snapshots
) {

    const result = {};


    if (!latest) {

        return result;
    }


    const previousSnapshot =
        getPreviousSnapshot(
            snapshots,
            latest.project,
            latest.date
        );


    latest.referrals.forEach(
        item => {

            /*
             * 没有销售的 Link 不显示。
             */

            if (
                Number(
                    item.total || 0
                ) === 0
            ) {

                return;
            }


            const channel =
                classifyChannel(
                    item.name
                );


            if (!result[channel]) {

                result[channel] = {

                    name: channel,

                    orders: 0,

                    revenue: 0,

                    dailyOrders: 0,

                    dailyRevenue: 0
                };
            }


            const previousReferral =
                previousSnapshot?.referrals?.find(
                    r =>
                        r.name === item.name
                );


            const daily =
                calculateDaily(
                    item,
                    previousReferral
                );


            result[channel].orders +=
                Number(
                    item.orders || 0
                );


            result[channel].revenue +=
                Number(
                    item.total || 0
                );


            result[channel].dailyOrders +=
                daily.orders;


            result[channel].dailyRevenue +=
                daily.revenue;
        }
    );


    /*
     * 最终再次过滤销售为 0 的渠道。
     */

    Object.keys(result).forEach(
        channel => {

            if (
                result[channel].revenue
                === 0
            ) {

                delete result[channel];
            }
        }
    );


    return result;
}

/* =========================================================
   渠道每日新增
   ========================================================= */

function getChannelDailyData(
    snapshot,
    channelName,
    snapshots
) {

    if (!snapshot) {

        return {
            revenue: 0,
            orders: 0
        };
    }


    const previousSnapshot =
        getPreviousSnapshot(
            snapshots,
            snapshot.project,
            snapshot.date
        );


    let revenue = 0;
    let orders = 0;


    snapshot.referrals.forEach(
        currentReferral => {

            if (
                classifyChannel(
                    currentReferral.name
                ) !== channelName
            ) {

                return;
            }


            /*
             * 销售为 0 的 Link 不参与。
             */

            if (
                Number(
                    currentReferral.total || 0
                ) === 0
            ) {

                return;
            }


            const previousReferral =
                previousSnapshot?.referrals?.find(
                    item =>
                        item.name ===
                        currentReferral.name
                );


            const daily =
                calculateDaily(
                    currentReferral,
                    previousReferral
                );


            revenue +=
                daily.revenue;


            orders +=
                daily.orders;
        }
    );


    return {
        revenue:
            cleanNumber(revenue),
        orders:
            cleanNumber(orders)
    };
}


/* =========================================================
   当前有效渠道
   ========================================================= */

function getActiveChannels(
    snapshots
) {

    const latest =
        getLatestSnapshot(
            snapshots
        );


    if (!latest) {

        return [];
    }


    const channels =
        new Set();


    latest.referrals.forEach(
        item => {

            if (
                Number(
                    item.total || 0
                ) !== 0
            ) {

                channels.add(
                    classifyChannel(
                        item.name
                    )
                );
            }
        }
    );


    return Array.from(
        channels
    );
}

/* =========================================================
   Referral 明细
   ========================================================= */

function renderReferrals(
    latest,
    snapshots
) {

    const head =
        document.getElementById(
            "referralDailyHead"
        );


    const body =
        document.getElementById(
            "referralDailyBody"
        );


    head.innerHTML = "";
    body.innerHTML = "";


    const sorted =
        getSortedSnapshots(
            snapshots
        );


    if (!sorted.length) {

        body.innerHTML = `
            <tr>
                <td class="empty">
                    暂无数据
                </td>
            </tr>
        `;

        return;
    }


    /*
     * 只显示最新快照中有销售的 Link。
     */

    const activeReferrals =
        latest
            ? latest.referrals
                .filter(
                    item =>
                        Number(
                            item.total || 0
                        ) !== 0
                )
                .sort(
                    (a, b) =>
                        Number(
                            b.total || 0
                        ) -
                        Number(
                            a.total || 0
                        )
                )
            : [];


    if (!activeReferrals.length) {

        body.innerHTML = `
            <tr>
                <td
                    colspan="${
                        1 + sorted.length
                    }"
                    class="empty"
                >
                    暂无带量 Referral
                </td>
            </tr>
        `;

        return;
    }


    /* 表头 */

    let headerHtml = `
        <tr>
            <th>
                Link / 日期
            </th>
    `;


    sorted.forEach(
        snapshot => {

            const parts =
                snapshot.date.split("-");


            const shortDate =
                parts.length === 3
                    ? `${parts[1]}-${parts[2]}`
                    : snapshot.date;


            headerHtml += `
                <th>
                    ${escapeHtml(
                        shortDate
                    )}
                </th>
            `;
        }
    );


    headerHtml += `
        </tr>
    `;


    head.innerHTML =
        headerHtml;


    /* 每个 Referral 一行 */

    activeReferrals.forEach(
        referral => {

            let rowHtml = `
                <tr>

                    <td>

                        <div
                            class="referral-name"
                            title="${escapeHtml(
                                referral.name
                            )}"
                        >
                            ${escapeHtml(
                                referral.name
                            )}
                        </div>

                    </td>
            `;


            sorted.forEach(
                (snapshot, index) => {

                    const currentReferral =
                        snapshot.referrals.find(
                            item =>
                                item.name ===
                                referral.name
                        );


                    /*
                     * 当天不存在
                     */

                    if (!currentReferral) {

                        rowHtml += `
                            <td
                                class="referral-daily-zero"
                            >
                                ·
                            </td>
                        `;

                        return;
                    }


                    const currentRevenue =
                        Number(
                            currentReferral.total
                            || 0
                        );


                    if (
                        currentRevenue === 0
                    ) {

                        rowHtml += `
                            <td
                                class="referral-daily-zero"
                            >
                                ·
                            </td>
                        `;

                        return;
                    }


                    /*
                     * 第一份快照：
                     * 作为基准数据。
                     */

                    if (
                        index === 0
                    ) {

                        rowHtml += `
                            <td
                                class="
                                    referral-daily-positive
                                    referral-new-cell
                                    referral-new
                                "
                            >
                                +${money(
                                    currentRevenue
                                )}
                            </td>
                        `;

                        return;
                    }


                    const previousSnapshot =
                        sorted[
                            index - 1
                        ];


                    const previousReferral =
                        previousSnapshot.referrals.find(
                            item =>
                                item.name ===
                                referral.name
                        );


                    const previousRevenue =
                        previousReferral
                            ? Number(
                                previousReferral.total
                                || 0
                            )
                            : 0;


                    let dailyRevenue =
                        currentRevenue -
                        previousRevenue;


                    dailyRevenue =
                        cleanNumber(
                            dailyRevenue
                        );


                    /*
                     * 如果累计数据下降：
                     *
                     * Referral 明细仍然保留真实下降，
                     * 因为这里是明细数据。
                     *
                     * 但“每日新增看板”和“渠道每日新增”
                     * 会按 0 处理。
                     */

                    if (
                        dailyRevenue === 0
                    ) {

                        rowHtml += `
                            <td
                                class="
                                    referral-daily-zero
                                "
                            >
                                ·
                            </td>
                        `;

                        return;
                    }


                    /*
                     * 新 Link
                     */

                    if (
                        !previousReferral &&
                        dailyRevenue > 0
                    ) {

                        rowHtml += `
                            <td
                                class="
                                    referral-daily-positive
                                    referral-new-cell
                                    referral-new
                                "
                            >
                                +${money(
                                    dailyRevenue
                                )}
                            </td>
                        `;

                        return;
                    }


                    /*
                     * 正增长
                     */

                    if (
                        dailyRevenue > 0
                    ) {

                        rowHtml += `
                            <td
                                class="
                                    referral-daily-positive
                                "
                            >
                                +${money(
                                    dailyRevenue
                                )}
                            </td>
                        `;

                        return;
                    }


                    /*
                     * 真正累计下降
                     */

                    rowHtml += `
                        <td
                            class="
                                referral-daily-negative
                            "
                        >
                            -$${Math.abs(
                                dailyRevenue
                            ).toLocaleString(
                                "en-US",
                                {
                                    minimumFractionDigits: 0,
                                    maximumFractionDigits: 2
                                }
                            )}
                        </td>
                    `;
                }
            );


            rowHtml += `
                </tr>
            `;


            body.innerHTML +=
                rowHtml;
        }
    );
}


/* =========================================================
   数据概览
   ========================================================= */

function renderStats() {

    const snapshots =
        getSnapshots();


    const latest =
        getLatestSnapshot(
            snapshots
        );


    if (!latest) {

        document.getElementById(
            "latestRevenue"
        ).textContent = "$0";


        document.getElementById(
            "latestOrders"
        ).textContent = "0";


        document.getElementById(
            "todayRevenue"
        ).textContent = "$0";


        document.getElementById(
            "todayOrders"
        ).textContent = "0";


        return;
    }


    let revenue = 0;
    let orders = 0;


    latest.referrals.forEach(
        item => {

            revenue +=
                Number(
                    item.total || 0
                );


            orders +=
                Number(
                    item.orders || 0
                );
        }
    );


    const daily =
        getSnapshotDailyTotal(
            latest,
            snapshots
        );


    document.getElementById(
        "latestRevenue"
    ).textContent =
        money(revenue);


    document.getElementById(
        "latestOrders"
    ).textContent =
        number(orders);


    document.getElementById(
        "todayRevenue"
    ).textContent =
        money(daily.revenue);


    document.getElementById(
        "todayOrders"
    ).textContent =
        number(daily.orders);
}


/* =========================================================
   每日新增看板
   ========================================================= */

function renderDailyBoard() {

    const snapshots =
        getSnapshots();


    const tbody =
        document.getElementById(
            "dailyBoardBody"
        );


    tbody.innerHTML = "";


    const sorted =
        getSortedSnapshots(
            snapshots
        );


    if (!sorted.length) {

        tbody.innerHTML = `
            <tr>
                <td
                    colspan="5"
                    class="empty"
                >
                    暂无历史数据
                </td>
            </tr>
        `;

        return;
    }


    let previousDaily =
        null;


    sorted.forEach(
        (snapshot, index) => {

            /*
             * 今天真正新增的数据。
             */

            const current =
                getSnapshotDailyTotal(
                    snapshot,
                    sorted
                );


            /*
             * “变化”只显示增加。
             *
             * 如果今天新增比昨天少，
             * 不显示负数，直接显示 0。
             */

            let revenueChange = 0;
            let orderChange = 0;


            if (
                previousDaily !== null
            ) {

                revenueChange =
                    current.revenue -
                    previousDaily.revenue;


                orderChange =
                    current.orders -
                    previousDaily.orders;


                /*
                 * 关键：
                 * 不允许出现负数。
                 */

                if (
                    revenueChange < 0
                ) {

                    revenueChange = 0;
                }


                if (
                    orderChange < 0
                ) {

                    orderChange = 0;
                }


                revenueChange =
                    cleanNumber(
                        revenueChange
                    );


                orderChange =
                    cleanNumber(
                        orderChange
                    );
            }


            tbody.innerHTML += `

                <tr>

                    <td>
                        ${escapeHtml(
                            snapshot.date
                        )}
                    </td>

                    <td class="${
                        current.revenue > 0
                            ? "positive"
                            : "muted"
                    }">
                        ${money(
                            current.revenue
                        )}
                    </td>

                    <td class="${
                        revenueChange > 0
                            ? "change-up"
                            : ""
                    }">

                        ${
                            index === 0
                                ? "—"
                                : revenueChange > 0
                                    ? signedMoney(
                                        revenueChange
                                    )
                                    : "$0"
                        }

                    </td>

                    <td class="${
                        current.orders > 0
                            ? "positive"
                            : "muted"
                    }">
                        ${number(
                            current.orders
                        )}
                    </td>

                    <td class="${
                        orderChange > 0
                            ? "change-up"
                            : ""
                    }">

                        ${
                            index === 0
                                ? "—"
                                : orderChange > 0
                                    ? signedNumber(
                                        orderChange
                                    )
                                    : "0"
                        }

                    </td>

                </tr>

            `;


            previousDaily =
                current;
        }
    );
}

            now.getMonth() + 1
        ).padStart(2, "0") +
