<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IGG Referral Tracker</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px;
    background: #f5f7fa;
    color: #1f2937;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
}

.container {
    max-width: 1500px;
    margin: 0 auto;
}

h1 {
    margin: 0 0 25px;
    font-size: 30px;
}

h2 {
    margin: 0 0 18px;
    font-size: 20px;
}

.card {
    background: #fff;
    border-radius: 12px;
    padding: 22px;
    margin-bottom: 22px;
    box-shadow: 0 2px 10px rgba(0,0,0,.05);
}

.form-row {
    display: flex;
    gap: 15px;
    align-items: center;
    flex-wrap: wrap;
}

input[type="date"] {
    padding: 10px 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
}

textarea {
    width: 100%;
    min-height: 230px;
    margin-top: 15px;
    padding: 14px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    resize: vertical;
    font-family: monospace;
    font-size: 13px;
}

button {
    border: 0;
    border-radius: 8px;
    padding: 10px 16px;
    cursor: pointer;
    font-size: 14px;
    background: #111827;
    color: #fff;
}

button:hover {
    opacity: .9;
}

button.secondary {
    background: #6b7280;
}

button.danger {
    background: #dc2626;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
}

.stat {
    padding: 18px;
    background: #f8fafc;
    border-radius: 10px;
}

.stat-label {
    font-size: 13px;
    color: #6b7280;
    margin-bottom: 8px;
}

.stat-value {
    font-size: 24px;
    font-weight: 700;
}

.table-wrap {
    width: 100%;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 700px;
}

th,
td {
    padding: 12px 10px;
    border-bottom: 1px solid #e5e7eb;
    text-align: right;
    white-space: nowrap;
}

th {
    background: #f8fafc;
    color: #4b5563;
    font-size: 13px;
    font-weight: 600;
}

th:first-child,
td:first-child {
    text-align: left;
}

td {
    font-size: 14px;
}

.positive {
    color: #16a34a;
}

.negative {
    color: #dc2626;
}

.change-up {
    color: #16a34a;
    font-weight: 600;
}

.change-down {
    color: #dc2626;
    font-weight: 600;
}

.muted {
    color: #9ca3af;
}

.channel-title {
    font-weight: 600;
}

.channel-table th {
    text-align: center;
}

.channel-table th:first-child {
    text-align: left;
}

.channel-table td {
    text-align: center;
}

.channel-table td:first-child {
    text-align: left;
}

.daily-cell {
    min-width: 125px;
}

.daily-sales {
    font-weight: 600;
}

.daily-orders {
    margin-top: 4px;
    color: #6b7280;
    font-size: 12px;
}

.section-note {
    color: #6b7280;
    font-size: 13px;
    margin-top: -8px;
    margin-bottom: 15px;
}

.empty {
    padding: 30px;
    text-align: center;
    color: #9ca3af;
}

.detail-box {
    background: #f8fafc;
    border-radius: 8px;
    padding: 15px;
    margin-top: 12px;
}

.history-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 13px 0;
    border-bottom: 1px solid #e5e7eb;
}

.history-item:last-child {
    border-bottom: 0;
}

.small {
    font-size: 12px;
    color: #6b7280;
}

@media (max-width: 900px) {
    .stats {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 600px) {
    body {
        padding: 15px;
    }

    .stats {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>IGG Referral Tracker</h1>

    <!-- 数据导入 -->
    <div class="card">
        <h2>数据导入</h2>

        <div class="form-row">
            <label>数据日期：</label>
            <input type="date" id="snapshotDate">

            <button onclick="importData()">导入数据</button>
            <button class="secondary" onclick="loadDemo()">加载示例</button>
            <button class="danger" onclick="clearHistory()">清空历史</button>

    <!-- 数据概览 -->

            <div class="stat">

            <div class="stat">

        <div class="table-wrap">

        </div>

            <table>
                <thead>
                    <tr>
                        <th>渠道</th>
                        <th>累计订单</th>
                        <th>累计销售额</th>
                        <th>今日新增订单</th>
                        <th>今日新增销售额</th>
                    </tr>
                </thead>

                <tbody id="channelBody"></tbody>
            </table>
        </div>
    </div>


    <!-- 渠道每日新增 -->
    <div class="card">
        <h2>渠道每日新增</h2>

        <div class="section-note">
            每日新增 = 当日累计数据 - 前一日累计数据；若两天数据一致，则新增为 0。
        </div>

        <div class="table-wrap">
            <table class="channel-table">
                <thead id="channelDailyHead"></thead>
                <tbody id="channelDailyBody"></tbody>
            </table>
        </div>
    </div>


    <!-- Referral 明细 -->
    <div class="card">
        <h2>Referral 明细</h2>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Referral</th>
                        <th>渠道</th>
                        <th>累计订单</th>
                        <th>累计销售额</th>
                        <th>今日新增订单</th>
                        <th>今日新增销售额</th>
                    </tr>
                </thead>

                <tbody id="referralBody"></tbody>
            </table>
        </div>
    </div>


    <!-- 历史记录 -->
    <div class="card">
        <h2>历史数据</h2>

        <div id="historyBody"></div>
    </div>

</div>


<script>

const STORAGE_KEY = "igg_referral_snapshots";


// ==============================
// 基础工具
// ==============================

function getSnapshots() {
    try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch (e) {
        return [];
    }
}

function saveSnapshots(snapshots) {
    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(snapshots)
    );
}

function money(value) {
    value = Number(value || 0);

    return new Intl.NumberFormat("en-US", {
        style: "currency",
        currency: "USD",
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
    }).format(value);
}

function number(value) {
    return Number(value || 0).toLocaleString();
}

function signedMoney(value) {
    value = Number(value || 0);

    if (value > 0) {
        return "+" + money(value);
    }

    if (value < 0) {
        return "-" + money(Math.abs(value));
    }

    return money(0);
}

function signedNumber(value) {
    value = Number(value || 0);

    if (value > 0) {
        return "+" + number(value);
    }

    if (value < 0) {
        return "-" + number(Math.abs(value));
    }

    return "0";
}

function changeClass(value) {

    value = Number(value || 0);

    if (value > 0) {
        return "change-up";
    }

    if (value < 0) {
        return "change-down";
    }

    return "";
}

function parseMoney(value) {

    if (value === undefined || value === null) {
        return 0;
    }

    return Number(
        String(value)
            .replace(/[$,\s]/g, "")
            .replace(/[^\d.-]/g, "")
    ) || 0;
}

function escapeHtml(str) {

    return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


// ==============================
// 渠道分类
// ==============================

function classifyChannel(name) {

    const n = String(name || "")
        .trim()
        .toLowerCase();

    if (
        n.startsWith("gg_plat") ||
        n.startsWith("gg-plat") ||
        n.startsWith("gg_ads") ||
        n.startsWith("gg-ads") ||
        n === "ggads" ||
        n.startsWith("google_ads") ||
        n.startsWith("google-ads") ||
        n.startsWith("google ads") ||
        n.startsWith("googleads")
    ) {
        return "Google Ads";
    }

    if (
        n.startsWith("meta_") ||
        n.startsWith("meta-") ||
        n.startsWith("meta ads") ||
        n.startsWith("metaads") ||
        n === "meta"
    ) {
        return "Meta Ads";
    }

    if (n === "hoverair.com") {
        return "hoverair.com";
    }

    if (
        n.startsWith("fb-group") ||
        n.startsWith("fb_group") ||
        n.startsWith("fb group") ||
        n.startsWith("facebook-group") ||
        n.startsWith("facebook_group") ||
        n.startsWith("facebook group") ||
        n.includes("fb-group")
    ) {
        return "FB Group";
    }

    if (
        n.includes("social media")
    ) {
        return "Social Media";
    }

    if (
        n === "facebook" ||
        n.startsWith("facebook/")
    ) {
        return "Facebook";
    }

    if (
        n === "instagram" ||
        n.startsWith("instagram/")
    ) {
        return "Instagram";
    }

    if (
        n === "reddit" ||
        n.startsWith("reddit/")
    ) {
        return "Reddit";
    }

    if (
        n === "x" ||
        n === "twitter" ||
        n.includes("twitter") ||
        n.includes("x.com")
    ) {
        return "X/Twitter";
    }

    if (n.includes("pr")) {
        return "PR";
    }

    if (
        n.startsWith("igg_") ||
        n.startsWith("igg-") ||
        n.startsWith("igg ") ||
        n.includes("igg newsletter") ||
        n.includes("igg-dedicated") ||
        n.includes("igg_dedicated")
    ) {
        return "IGG Newsletter";
    }

    if (n.includes("edm")) {
        return "EDM";
    }

    if (
        n.includes("ifa") ||
        n.includes("event")
    ) {
        return "IFA/Event";
    }

    if (n.includes("update")) {
        return "Update";
    }

    return "Other";
}


// ==============================
// Referral 数据解析
// ==============================

function parseReferralText(raw) {

    const lines = raw
        .split(/\r?\n/)
        .map(x => x.trim())
        .filter(Boolean);

    const referrals = [];

    let i = 0;

    while (i < lines.length) {

        /*
         * IGG Referral 数据结构：
         *
         * name
         * status
         * orders
         * oneDay
         * sevenDay
         * income
         * total
         */

        if (i + 6 >= lines.length) {
            break;
        }

        const name = lines[i];

        const status = lines[i + 1];

        const orders = Number(
            String(lines[i + 2])
                .replace(/,/g, "")
                .replace(/[^\d.-]/g, "")
        ) || 0;

        const oneDay = parseMoney(lines[i + 3]);

        const sevenDay = parseMoney(lines[i + 4]);

        const income = parseMoney(lines[i + 5]);

        const total = parseMoney(lines[i + 6]);

        /*
         * 如果明显不像 Referral 数据，
         * 往后寻找下一组。
         */

        if (
            name &&
            !/^(status|orders|one day|7 days|income|total)$/i.test(name)
        ) {

            referrals.push({
                name,
                status,
                orders,
                oneDay,
                sevenDay,
                income,
                total
            });

            i += 7;

        } else {

            i++;
        }
    }

    return referrals;
}


// ==============================
// Snapshot
// ==============================

function getPreviousSnapshot(
    snapshots,
    project,
    date
) {

    const previous = snapshots
        .filter(item =>
            item.project === project &&
            item.date < date
        )
        .sort((a, b) =>
            a.date.localeCompare(b.date)
        );

    return previous.length
        ? previous[previous.length - 1]
        : null;
}

function getLatestSnapshot(snapshots) {

    if (!snapshots.length) {
        return null;
    }

    return [...snapshots]
        .sort((a, b) =>
            b.date.localeCompare(a.date)
        )[0];
}


// ==============================
// 核心：计算每日新增
// ==============================

function calculateDaily(
    referral,
    previousReferral
) {

    const currentOrders =
        Number(referral?.orders || 0);

    const currentRevenue =
        Number(referral?.total || 0);


    const previousOrders =
        previousReferral
            ? Number(previousReferral.orders || 0)
            : 0;

    const previousRevenue =
        previousReferral
            ? Number(previousReferral.total || 0)
            : 0;


    /*
     * 核心逻辑：
     *
     * 当天累计 - 前一天累计
     *
     * 9.4 = 1000
     * 9.5 = 1000
     *
     * 1000 - 1000 = 0
     *
     * 不再读取旧的 dailyRevenue，
     * 避免历史错误数据影响结果。
     */

    return {

        orders:
            currentOrders - previousOrders,

        revenue:
            currentRevenue - previousRevenue
    };
}


// ==============================
// 找某个 Referral 的每日新增
// ==============================

function getReferralDaily(
    snapshot,
    referralName,
    snapshots
) {

    if (!snapshot) {
        return {
            orders: 0,
            revenue: 0
        };
    }

    const previousSnapshot =
        getPreviousSnapshot(
            snapshots,
            snapshot.project,
            snapshot.date
        );


    const currentReferral =
        snapshot.referrals.find(
            item => item.name === referralName
        );


    if (!currentReferral) {
        return {
            orders: 0,
            revenue: 0
        };
    }


    const previousReferral =
        previousSnapshot?.referrals?.find(
            item => item.name === referralName
        );


    return calculateDaily(
        currentReferral,
        previousReferral
    );
}


// ==============================
// Snapshot 每日总新增
// ==============================

function getSnapshotDailyTotal(
    snapshot,
    snapshots
) {

    if (!snapshot) {
        return {
            revenue: 0,
            orders: 0
        };
    }


    const previousSnapshot =
        getPreviousSnapshot(
            snapshots,
            snapshot.project,
            snapshot.date
        );


    let revenue = 0;
    let orders = 0;


    snapshot.referrals.forEach(item => {

        const previousReferral =
            previousSnapshot?.referrals?.find(
                r => r.name === item.name
            );


        const daily =
            calculateDaily(
                item,
                previousReferral
            );


        revenue += daily.revenue;
        orders += daily.orders;
    });


    return {
        revenue,
        orders
    };
}


// ==============================
// 导入数据
// ==============================

function importData() {

    const date =
        document.getElementById(
            "snapshotDate"
        ).value;

    const raw =
        document.getElementById(
            "rawData"
        ).value.trim();


    if (!date) {
        alert("请选择数据日期");
        return;
    }


    if (!raw) {
        alert("请粘贴 IGG Referral 数据");
        return;
    }


    const referrals =
        parseReferralText(raw);


    if (!referrals.length) {
        alert(
            "没有识别到有效 Referral 数据，请检查粘贴的数据格式。"
        );
        return;
    }


    const snapshots =
        getSnapshots();


    const snapshot = {

        project: "default",

        date,

        referrals
    };


    /*
     * 同一天重新导入：
     * 直接覆盖原来的数据。
     */

    const index =
        snapshots.findIndex(
            item =>
                item.project === "default" &&
                item.date === date
        );


    if (index >= 0) {

        snapshots[index] = snapshot;

    } else {

        snapshots.push(snapshot);
    }


    snapshots.sort((a, b) =>
        a.date.localeCompare(b.date)
    );


    saveSnapshots(snapshots);

    renderAll();

    alert(
        `导入成功：${date}\n识别到 ${referrals.length} 个 Referral`
    );
}


// ==============================
// 渠道表现
// ==============================

function buildChannelData(
    latest,
    snapshots
) {

    const result = {};


    if (!latest) {
        return result;
    }


    const previousSnapshot =
        getPreviousSnapshot(
            snapshots,
            latest.project,
            latest.date
        );


    latest.referrals.forEach(item => {

        /*
         * 销售额为 0 的 Referral 不参与渠道表现
         */

        if (Number(item.total || 0) === 0) {
            return;
        }


        const channel =
            classifyChannel(item.name);


        if (!result[channel]) {

            result[channel] = {

                name: channel,

                orders: 0,

                revenue: 0,

                dailyOrders: 0,

                dailyRevenue: 0
            };
        }


        const previousReferral =
            previousSnapshot?.referrals?.find(
                r => r.name === item.name
            );


        const daily =
            calculateDaily(
                item,
                previousReferral
            );


        result[channel].orders +=
            Number(item.orders || 0);

        result[channel].revenue +=
            Number(item.total || 0);

        result[channel].dailyOrders +=
            daily.orders;

        result[channel].dailyRevenue +=
            daily.revenue;
    });


    /*
     * 再次过滤：
     * 累计销售额为 0 的渠道不显示。
     */

    Object.keys(result).forEach(channel => {

        if (result[channel].revenue === 0) {
            delete result[channel];
        }
    });


    return result;
}


function renderChannels() {

    const snapshots =
        getSnapshots();

    const latest =
        getLatestSnapshot(snapshots);


    const tbody =
        document.getElementById(
            "channelBody"
        );


    tbody.innerHTML = "";


    if (!latest) {

        tbody.innerHTML =
            `<tr>
                <td colspan="5" class="empty">
                    暂无数据
                </td>
            </tr>`;

        return;
    }


    const channels =
        Object.values(
            buildChannelData(
                latest,
                snapshots
            )
        );


    channels.sort(
        (a, b) =>
            b.revenue - a.revenue
    );


    if (!channels.length) {

        tbody.innerHTML =
            `<tr>
                <td colspan="5" class="empty">
                    暂无带量渠道
                </td>
            </tr>`;

        return;
    }


    channels.forEach(channel => {

        tbody.innerHTML += `
            <tr>
                <td class="channel-title">
                    ${escapeHtml(channel.name)}
                </td>

                <td>
                    ${number(channel.orders)}
                </td>

                <td>
                    ${money(channel.revenue)}
                </td>

                <td class="${changeClass(channel.dailyOrders)}">
                    ${number(channel.dailyOrders)}
                </td>

                <td class="${changeClass(channel.dailyRevenue)}">
                    ${money(channel.dailyRevenue)}
                </td>
            </tr>
        `;
    });
}


// ==============================
// 渠道每日新增
// ==============================

function getChannelDailyData(
    snapshot,
    channelName,
    snapshots
) {

    if (!snapshot) {

        return {
            revenue: 0,
            orders: 0
        };
    }


    const previousSnapshot =
        getPreviousSnapshot(
            snapshots,
            snapshot.project,
            snapshot.date
        );


    let revenue = 0;
    let orders = 0;


    snapshot.referrals.forEach(item => {

        if (
            classifyChannel(item.name)
            !== channelName
        ) {
            return;
        }


        /*
         * 只统计当前有销售的 Referral。
         */

        if (Number(item.total || 0) === 0) {
            return;
        }


        const previousReferral =
            previousSnapshot?.referrals?.find(
                r => r.name === item.name
            );


        const daily =
            calculateDaily(
                item,
                previousReferral
            );


        revenue += daily.revenue;

        orders += daily.orders;
    });


    /*
     * 极小浮点误差直接归零。
     */

    if (Math.abs(revenue) < 0.000001) {
        revenue = 0;
    }

    if (Math.abs(orders) < 0.000001) {
        orders = 0;
    }


    return {
        revenue,
        orders
    };
}


// 只显示最新一天有累计销售的渠道
function getActiveChannels(
    snapshots
) {

    const latest =
        getLatestSnapshot(snapshots);


    if (!latest) {
        return [];
    }


    const channels = new Set();


    latest.referrals.forEach(item => {

        if (
            Number(item.total || 0) !== 0
        ) {

            channels.add(
                classifyChannel(item.name)
            );
        }
    });


    return Array.from(channels);
}


function renderDailyChannelTable(
    snapshots
) {

    const head =
        document.getElementById(
            "channelDailyHead"
        );

    const body =
        document.getElementById(
            "channelDailyBody"
        );


    head.innerHTML = "";
    body.innerHTML = "";


    const sorted =
        [...snapshots].sort(
            (a, b) =>
                a.date.localeCompare(b.date)
        );


    if (!sorted.length) {

        body.innerHTML =
            `<tr>
                <td class="empty">
                    暂无数据
                </td>
            </tr>`;

        return;
    }


    const channels =
        getActiveChannels(sorted);


    /*
     * 第一列：渠道
     * 后面每一天：Sales / Orders
     */

    let headHtml = `
        <tr>
            <th>渠道</th>
    `;


    sorted.forEach(snapshot => {

        headHtml += `
            <th colspan="2">
                ${escapeHtml(snapshot.date)}
            </th>
        `;
    });


    headHtml += `</tr>`;


    /*
     * 第二行表头
     */

    headHtml += `
        <tr>
            <th></th>
    `;


    sorted.forEach(() => {

        headHtml += `
            <th>Sales</th>
            <th>Orders</th>
        `;
    });


    headHtml += `</tr>`;


    head.innerHTML = headHtml;


    if (!channels.length) {

        body.innerHTML =
            `<tr>
                <td colspan="${1 + sorted.length * 2}"
                    class="empty">
                    暂无带量渠道
                </td>
            </tr>`;

        return;
    }


    /*
     * 每个渠道一行
     *
     * 注意：
     * 这里不再计算“今日比昨日多/少多少”。
     *
     * 每个格子直接显示当天实际新增。
     *
     * 例如：
     *
     * 9.4 累计 $1000
     * 9.5 累计 $1000
     *
     * 9.5 Sales = $0
     *
     * 不会出现 -$1000
     * 也不会出现红色。
     */

    channels.forEach(channel => {

        let row = `
            <tr>
                <td class="channel-title">
                    ${escapeHtml(channel)}
                </td>
        `;


        sorted.forEach(snapshot => {

            const daily =
                getChannelDailyData(
                    snapshot,
                    channel,
                    sorted
                );


            const salesClass =
                daily.revenue < 0
                    ? "negative"
                    : "";


            const ordersClass =
                daily.orders < 0
                    ? "negative"
                    : "";


            row += `
                <td class="daily-cell">
                    <div class="daily-sales ${salesClass}">
                        ${money(daily.revenue)}
                    </div>
                </td>

                <td class="daily-cell">
                    <div class="daily-orders ${ordersClass}">
                        ${number(daily.orders)}
                    </div>
                </td>
            `;
        });


        row += `</tr>`;


        body.innerHTML += row;
    });
}


// ==============================
// Referral 明细
// ==============================

function renderReferrals(
    latest,
    snapshots
) {

    const tbody =
        document.getElementById(
            "referralBody"
        );


    tbody.innerHTML = "";


    if (!latest) {

        tbody.innerHTML =
            `<tr>
                <td colspan="6" class="empty">
                    暂无数据
                </td>
            </tr>`;

        return;
    }


    const previousSnapshot =
        getPreviousSnapshot(
            snapshots,
            latest.project,
            latest.date
        );


    const referrals =
        latest.referrals
            .filter(item =>
                Number(item.total || 0) !== 0
            )
            .sort(
                (a, b) =>
                    Number(b.total || 0) -
                    Number(a.total || 0)
            );


    referrals.forEach(item => {

        const previousReferral =
            previousSnapshot?.referrals?.find(
                r => r.name === item.name
            );


        const daily =
            calculateDaily(
                item,
                previousReferral
            );


        tbody.innerHTML += `
            <tr>

                <td>
                    ${escapeHtml(item.name)}
                </td>

                <td>
                    ${escapeHtml(
                        classifyChannel(item.name)
                    )}
                </td>

                <td>
                    ${number(item.orders)}
                </td>

                <td>
                    ${money(item.total)}
                </td>

                <td class="${changeClass(daily.orders)}">
                    ${number(daily.orders)}
                </td>

                <td class="${changeClass(daily.revenue)}">
                    ${money(daily.revenue)}
                </td>

            </tr>
        `;
    });


    if (!referrals.length) {

        tbody.innerHTML =
            `<tr>
                <td colspan="6" class="empty">
                    暂无带量 Referral
                </td>
            </tr>`;
    }
}


// ==============================
// 数据概览
// ==============================

function renderStats() {

    const snapshots =
        getSnapshots();


    const latest =
        getLatestSnapshot(snapshots);


    if (!latest) {

        document.getElementById(
            "latestRevenue"
        ).textContent = "$0";

        document.getElementById(
            "latestOrders"
        ).textContent = "0";

        document.getElementById(
            "todayRevenue"
        ).textContent = "$0";

        document.getElementById(
            "todayOrders"
        ).textContent = "0";

        return;
    }


    let revenue = 0;
    let orders = 0;


    latest.referrals.forEach(item => {

        revenue +=
            Number(item.total || 0);

        orders +=
            Number(item.orders || 0);
    });


    const daily =
        getSnapshotDailyTotal(
            latest,
            snapshots
        );


    document.getElementById(
        "latestRevenue"
    ).textContent =
        money(revenue);


    document.getElementById(
        "latestOrders"
    ).textContent =
        number(orders);


    document.getElementById(
        "todayRevenue"
    ).textContent =
        money(daily.revenue);


    document.getElementById(
        "todayOrders"
    ).textContent =
        number(daily.orders);
}


// ==============================
// 每日新增看板
// ==============================

function renderDailyBoard() {

    const snapshots =
        getSnapshots();


    const tbody =
        document.getElementById(
            "dailyBoardBody"
        );


    tbody.innerHTML = "";


    const sorted =
        [...snapshots].sort(
            (a, b) =>
                a.date.localeCompare(b.date)
        );


    sorted.forEach(
        (snapshot, index) => {

            const current =
                getSnapshotDailyTotal(
                    snapshot,
                    sorted
                );


            let revenueChange = 0;
            let orderChange = 0;


            if (index > 0) {

                const previous =
                    getSnapshotDailyTotal(
                        sorted[index - 1],
                        sorted
                    );


                revenueChange =
                    current.revenue -
                    previous.revenue;


                orderChange =
                    current.orders -
                    previous.orders;
            }


            tbody.innerHTML += `
                <tr>

                    <td>
                        ${escapeHtml(snapshot.date)}
                    </td>

                    <td>
                        ${money(current.revenue)}
                    </td>

                    <td class="${changeClass(revenueChange)}">
                        ${
                            index === 0
                                ? "—"
                                : signedMoney(revenueChange)
                        }
                    </td>

                    <td>
                        ${number(current.orders)}
                    </td>

                    <td class="${changeClass(orderChange)}">
                        ${
                            index === 0
                                ? "—"
                                : signedNumber(orderChange)
                        }
                    </td>

                </tr>
            `;
        }
    );


    if (!sorted.length) {

        tbody.innerHTML =
            `<tr>
                <td colspan="5"
                    class="empty">
                    暂无历史数据
                </td>
            </tr>`;
    }
}


// ==============================
// 历史数据
// ==============================

function renderHistory() {

    const snapshots =
        getSnapshots();


    const container =
        document.getElementById(
            "historyBody"
        );


    container.innerHTML = "";


    const sorted =
        [...snapshots].sort(
            (a, b) =>
                b.date.localeCompare(a.date)
        );


    if (!sorted.length) {

        container.innerHTML =
            `<div class="empty">
                暂无历史数据
            </div>`;

        return;
    }


    sorted.forEach(snapshot => {

        let revenue = 0;
        let orders = 0;


        snapshot.referrals.forEach(item => {

            revenue +=
                Number(item.total || 0);

            orders +=
                Number(item.orders || 0);
        });


        container.innerHTML += `
            <div class="history-item">

                <div>
                    <strong>
                        ${escapeHtml(snapshot.date)}
                    </strong>

                    <div class="small">
                        ${snapshot.referrals.length}
                        个 Referral
                    </div>
                </div>

                <div>
                    <strong>
                        ${money(revenue)}
                    </strong>

                    <span class="small">
                        /
                        ${number(orders)}
                        orders
                    </span>
                </div>

            </div>
        `;
    });
}


// ==============================
// 清空历史
// ==============================

function clearHistory() {

    if (
        !confirm(
            "确定要清空所有历史数据吗？"
        )
    ) {
        return;
    }


    localStorage.removeItem(
        STORAGE_KEY
    );


    renderAll();
}

// ==============================
// 初始化
// ==============================

function init() {

    const dateInput =
        document.getElementById(
            "snapshotDate"
        );


    /*
     * 使用本地时间，而不是 UTC，
     * 避免新加坡晚上导入时日期少一天。
     */

    const now = new Date();

    const localDate =
        now.getFullYear() +
        "-" +
        String(
            now.getMonth() + 1
        ).padStart(2, "0") +
        "-" +
        String(
            now.getDate()
        ).padStart(2, "0");


    dateInput.value =
        localDate;


    renderAll();
}


init();
