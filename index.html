<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IGG Referral Tracker</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px;
    background: #f5f7fa;
    color: #1f2937;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        Arial,
        sans-serif;
}

.container {
    max-width: 1600px;
    margin: 0 auto;
}

h1 {
    margin: 0 0 25px;
    font-size: 30px;
    color: #111827;
}

h2 {
    margin: 0 0 18px;
    font-size: 20px;
    color: #111827;
}

.card {
    background: #fff;
    border-radius: 12px;
    padding: 22px;
    margin-bottom: 22px;
    box-shadow: 0 2px 10px rgba(0,0,0,.05);
}

.form-row {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
}

.form-row label {
    font-size: 14px;
    color: #4b5563;
}

input[type="date"] {
    padding: 10px 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
    background: #fff;
}

textarea {
    width: 100%;
    min-height: 250px;
    margin-top: 15px;
    padding: 14px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    resize: vertical;
    font-family: monospace;
    font-size: 13px;
    line-height: 1.6;
}

button {
    border: 0;
    border-radius: 8px;
    padding: 10px 16px;
    cursor: pointer;
    font-size: 14px;
    background: #111827;
    color: #fff;
}

button:hover {
    opacity: .88;
}

button.secondary {
    background: #6b7280;
}

button.danger {
    background: #dc2626;
}

/* =========================
   数据概览
   ========================= */

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
}

.stat {
    padding: 18px;
    background: #f8fafc;
    border-radius: 10px;
}

.stat-label {
    font-size: 13px;
    color: #6b7280;
    margin-bottom: 8px;
}

.stat-value {
    font-size: 24px;
    font-weight: 700;
    color: #111827;
}

/* =========================
   通用表格
   ========================= */

.table-wrap {
    width: 100%;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 700px;
}

th,
td {
    padding: 12px 10px;
    border-bottom: 1px solid #e5e7eb;
    text-align: right;
    white-space: nowrap;
}

th {
    background: #f8fafc;
    color: #4b5563;
    font-size: 13px;
    font-weight: 600;
}

th:first-child,
td:first-child {
    text-align: left;
}

td {
    font-size: 14px;
}

.empty {
    padding: 30px !important;
    text-align: center !important;
    color: #9ca3af;
}

.section-note {
    color: #6b7280;
    font-size: 13px;
    margin-top: -8px;
    margin-bottom: 15px;
}

/* =========================
   数字颜色
   ========================= */

.change-up {
    color: #15803d;
    font-weight: 700;
}

.change-down {
    color: #dc2626;
    font-weight: 700;
}

.positive {
    color: #15803d;
}

.negative {
    color: #dc2626;
}

.muted {
    color: #9ca3af;
}

/* =========================
   渠道表现
   ========================= */

.channel-title {
    font-weight: 600;
}

.channel-table th {
    text-align: center;
}

.channel-table th:first-child {
    text-align: left;
}

.channel-table td {
    text-align: center;
}

.channel-table td:first-child {
    text-align: left;
}

/* =========================
   渠道每日新增
   ========================= */

.daily-channel-wrap {
    width: 100%;
    overflow: auto;
    max-height: 650px;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
}

.daily-channel-table {
    width: max-content;
    min-width: 100%;
    border-collapse: separate;
    border-spacing: 0;
}

.daily-channel-table th {
    position: sticky;
    top: 0;
    z-index: 4;
    background: #f8fafc;
    text-align: center;
    min-width: 130px;
}

.daily-channel-table th:first-child {
    left: 0;
    z-index: 6;
    min-width: 220px;
    text-align: left;
}

.daily-channel-table td {
    min-width: 130px;
    text-align: center;
    height: 55px;
}

.daily-channel-table td:first-child {
    position: sticky;
    left: 0;
    z-index: 3;
    background: #fff;
    min-width: 220px;
    text-align: left;
    font-weight: 600;
}

/* =========================
   Referral 每日销售变化
   ========================= */

.referral-daily-wrap {
    width: 100%;
    max-height: 720px;
    overflow: auto;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
}

.referral-daily-table {
    width: max-content;
    min-width: 100%;
    border-collapse: separate;
    border-spacing: 0;
}

.referral-daily-table th,
.referral-daily-table td {
    border-right: 1px solid #e5e7eb;
    border-bottom: 1px solid #e5e7eb;
}

.referral-daily-table th {
    position: sticky;
    top: 0;
    z-index: 4;
    min-width: 145px;
    height: 52px;
    background: #f8fafc;
    text-align: center;
    color: #6b7280;
    font-size: 14px;
    font-weight: 700;
}

.referral-daily-table th:first-child {
    position: sticky;
    left: 0;
    top: 0;
    z-index: 7;
    min-width: 360px;
    text-align: left;
    background: #f8fafc;
}

.referral-daily-table td {
    position: relative;
    min-width: 145px;
    height: 54px;
    padding: 0 14px;
    text-align: center;
    font-size: 16px;
    font-weight: 700;
}

.referral-daily-table td:first-child {
    position: sticky;
    left: 0;
    z-index: 3;
    min-width: 360px;
    max-width: 360px;
    background: #fff;
    text-align: left;
    font-family: monospace;
    font-weight: 600;
}

.referral-name {
    max-width: 330px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.referral-date {
    font-weight: 700;
}

/* 正增长 */

.referral-daily-positive {
    background: #edf7ef;
    color: #15803d;
}

/* 负增长 */

.referral-daily-negative {
    background: #fceaea;
    color: #15803d;
}

/* 0 / 无变化 */

.referral-daily-zero {
    background: #fff;
    color: #cbd5e1;
    font-weight: 400 !important;
}

/* NEW */

.referral-new-cell {
    border: 2px dashed #f3a6c5 !important;
}

.referral-new::after {
    content: "NEW";
    position: absolute;
    top: 0;
    right: 0;
    padding: 4px 7px;
    background: #ec1675;
    color: #fff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    font-size: 11px;
    line-height: 1;
    font-weight: 700;
}

/* =========================
   历史
   ========================= */

.history-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 13px 0;
    border-bottom: 1px solid #e5e7eb;
}

.history-item:last-child {
    border-bottom: 0;
}

.small {
    font-size: 12px;
    color: #6b7280;
    margin-top: 4px;
}

/* =========================
   Responsive
   ========================= */

@media (max-width: 900px) {

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .referral-daily-table th:first-child,
    .referral-daily-table td:first-child {
        min-width: 260px;
        max-width: 260px;
    }

    .referral-daily-table th,
    .referral-daily-table td {
        min-width: 120px;
    }
}

@media (max-width: 600px) {

    body {
        padding: 15px;
    }

    .stats {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>IGG Referral Tracker</h1>

    <!-- =========================
         数据导入
         ========================= -->

    <div class="card">

        <h2>数据导入</h2>

        <div class="form-row">

            <label for="snapshotDate">
                数据日期：
            </label>

            <input
                type="date"
                id="snapshotDate"
            >

            <button onclick="importData()">
                导入数据
            </button>

            <button
                class="secondary"
                onclick="loadDemo()"
            >
                加载示例
            </button>

            <button
                class="danger"
                onclick="clearHistory()"
            >
                清空历史
            </button>

        </div>

        <textarea
            id="rawData"
            placeholder="请粘贴 IGG Referral Links 数据"
        ></textarea>

    </div>


    <!-- =========================
         数据概览
         ========================= -->

    <div class="card">

        <h2>数据概览</h2>

        <div class="stats">

            <div class="stat">

                <div class="stat-label">
                    最新累计销售额
                </div>

                <div
                    class="stat-value"
                    id="latestRevenue"
                >
                    $0
                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    最新累计订单
                </div>

                <div
                    class="stat-value"
                    id="latestOrders"
                >
                    0
                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    今日新增销售额
                </div>

                <div
                    class="stat-value"
                    id="todayRevenue"
                >
                    $0
                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    今日新增订单
                </div>

                <div
                    class="stat-value"
                    id="todayOrders"
                >
                    0
                </div>

            </div>

        </div>

    </div>


    <!-- =========================
         每日新增看板
         ========================= -->

    <div class="card">

        <h2>每日新增看板</h2>

        <div class="section-note">
            每日新增 = 当日累计数据 − 上一次快照累计数据
        </div>

        <div class="table-wrap">

            <table>

                <thead>

                    <tr>
                        <th>日期</th>
                        <th>销售</th>
                        <th>销售变化</th>
                        <th>订单</th>
                        <th>订单变化</th>
                    </tr>

                </thead>

                <tbody id="dailyBoardBody"></tbody>

            </table>

        </div>

    </div>


    <!-- =========================
         渠道表现
         ========================= -->

    <div class="card">

        <h2>渠道表现</h2>

        <div class="section-note">
            销售额为 0、没有带量的渠道不显示
        </div>

        <div class="table-wrap">

            <table>

                <thead>

                    <tr>
                        <th>渠道</th>
                        <th>累计订单</th>
                        <th>累计销售额</th>
                        <th>今日新增订单</th>
                        <th>今日新增销售额</th>
                    </tr>

                </thead>

                <tbody id="channelBody"></tbody>

            </table>

        </div>

    </div>


    <!-- =========================
         渠道每日新增
         ========================= -->

    <div class="card">

        <h2>渠道每日新增</h2>

        <div class="section-note">
            每个日期直接显示该渠道当天实际新增销售额及订单。
            当天累计与上一快照一致时显示 0。
        </div>

        <div class="daily-channel-wrap">

            <table class="daily-channel-table">

                <thead id="channelDailyHead"></thead>

                <tbody id="channelDailyBody"></tbody>

            </table>

        </div>

    </div>


    <!-- =========================
         Referral 明细
         ========================= -->

    <div class="card">

        <h2>Referral 明细</h2>

        <div class="section-note">
            行 = Link，列 = 快照日期；单元格 = 当日销售变化
        </div>

        <div class="referral-daily-wrap">

            <table class="referral-daily-table">

                <thead id="referralDailyHead"></thead>

                <tbody id="referralDailyBody"></tbody>

            </table>

        </div>

    </div>


    <!-- =========================
         历史数据
         ========================= -->

    <div class="card">

        <h2>历史数据</h2>

        <div id="historyBody"></div>

    </div>

</div>


<script>

/* =========================================================
   基础配置
   ========================================================= */

const STORAGE_KEY =
    "igg_referral_snapshots";


/* =========================================================
   LocalStorage
   ========================================================= */

function getSnapshots() {

    try {

        return JSON.parse(
            localStorage.getItem(STORAGE_KEY)
        ) || [];

    } catch (error) {

        return [];
    }
}


function saveSnapshots(snapshots) {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(snapshots)
    );
}


/* =========================================================
   格式化
   ========================================================= */

function money(value) {

    const n = Number(value || 0);

    return new Intl.NumberFormat(
        "en-US",
        {
            style: "currency",
            currency: "USD",
            minimumFractionDigits: 0,
            maximumFractionDigits: 2
        }
    ).format(n);
}


function number(value) {

    return Number(value || 0)
        .toLocaleString("en-US");
}


function signedMoney(value) {

    const n = Number(value || 0);

    if (n > 0) {
        return "+" + money(n);
    }

    if (n < 0) {
        return "-$" + Math.abs(n)
            .toLocaleString("en-US", {
                minimumFractionDigits: 0,
                maximumFractionDigits: 2
            });
    }

    return "$0";
}


function signedNumber(value) {

    const n = Number(value || 0);

    if (n > 0) {
        return "+" + number(n);
    }

    if (n < 0) {
        return "-" + number(Math.abs(n));
    }

    return "0";
}


function changeClass(value) {

    const n = Number(value || 0);

    if (n > 0) {
        return "change-up";
    }

    if (n < 0) {
        return "change-down";
    }

    return "";
}


function escapeHtml(str) {

    return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function parseMoney(value) {

    if (
        value === undefined ||
        value === null ||
        value === ""
    ) {
        return 0;
    }

    let text =
        String(value)
            .trim()
            .replace(/,/g, "")
            .replace(/\$/g, "");

    const match =
        text.match(/-?\d+(?:\.\d+)?/);

    if (!match) {
        return 0;
    }

    return Number(match[0]) || 0;
}


/* =========================================================
   渠道分类
   ========================================================= */

function classifyChannel(name) {

    const n =
        String(name || "")
            .trim()
            .toLowerCase();


    /* Google Ads */

    if (
        n.startsWith("gg_plat") ||
        n.startsWith("gg-plat") ||
        n.startsWith("gg_ads") ||
        n.startsWith("gg-ads") ||
        n === "ggads" ||
        n.startsWith("google_ads") ||
        n.startsWith("google-ads") ||
        n.startsWith("google ads") ||
        n.startsWith("googleads")
    ) {

        return "Google Ads";
    }


    /* Meta Ads */

    if (
        n.startsWith("meta_") ||
        n.startsWith("meta-") ||
        n.startsWith("meta ads") ||
        n.startsWith("metaads") ||
        n === "meta"
    ) {

        return "Meta Ads";
    }


    /* hoverair.com */

    if (n === "hoverair.com") {

        return "hoverair.com";
    }


    /* FB Group */

    if (
        n.startsWith("fb-group") ||
        n.startsWith("fb_group") ||
        n.startsWith("fb group") ||
        n.startsWith("facebook-group") ||
        n.startsWith("facebook_group") ||
        n.startsWith("facebook group") ||
        n.includes("fb-group")
    ) {

        return "FB Group";
    }


    /* Social Media */

    if (
        n.includes("social media")
    ) {

        return "Social Media";
    }


    /* Facebook */

    if (
        n === "facebook" ||
        n.startsWith("facebook/")
    ) {

        return "Facebook";
    }


    /* Instagram */

    if (
        n === "instagram" ||
        n.startsWith("instagram/")
    ) {

        return "Instagram";
    }


    /* Reddit */

    if (
        n === "reddit" ||
        n.startsWith("reddit/")
    ) {

        return "Reddit";
    }


    /* X / Twitter */

    if (
        n === "x" ||
        n === "twitter" ||
        n.includes("twitter") ||
        n.includes("x.com")
    ) {

        return "X/Twitter";
    }


    /* PR */

    if (
        n.startsWith("pr-") ||
        n.startsWith("pr_") ||
        n.startsWith("pr ") ||
        n === "pr"
    ) {

        return "PR";
    }


    /* IGG Newsletter */

    if (
        n.startsWith("igg_") ||
        n.startsWith("igg-") ||
        n.startsWith("igg ") ||
        n.includes("igg newsletter") ||
        n.includes("igg-dedicated") ||
        n.includes("igg_dedicated")
    ) {

        return "IGG Newsletter";
    }


    /* EDM */

    if (
        n.startsWith("edm") ||
        n.includes("edm-") ||
        n.includes("edm_")
    ) {

        return "EDM";
    }


    /* IFA / Event */

    if (
        n.includes("ifa") ||
        n.includes("event")
    ) {

        return "IFA/Event";
    }


    /* Update */

    if (
        n.startsWith("update") ||
        n.includes("update-") ||
        n.includes("update_")
    ) {

        return "Update";
    }


    return "Other";
}


/* =========================================================
   解析 IGG Referral 数据
   ========================================================= */

function parseReferralText(raw) {

    const lines =
        raw
            .split(/\r?\n/)
            .map(line => line.trim())
            .filter(Boolean);


    const referrals = [];


    /*
     * IGG Referral 原始结构通常为：
     *
     * Link
     * Status
     * Orders
     * 1 day
     * 7 days
     * Income
     * Total
     *
     * 因此按照 7 行为一组解析。
     */

    let i = 0;


    while (
        i + 6 < lines.length
    ) {

        const name =
            lines[i];

        const status =
            lines[i + 1];

        const ordersText =
            lines[i + 2];

        const oneDayText =
            lines[i + 3];

        const sevenDayText =
            lines[i + 4];

        const incomeText =
            lines[i + 5];

        const totalText =
            lines[i + 6];


        const orders =
            Number(
                String(ordersText)
                    .replace(/,/g, "")
                    .replace(/[^\d.-]/g, "")
            ) || 0;


        const oneDay =
            parseMoney(oneDayText);


        const sevenDay =
            parseMoney(sevenDayText);


        const income =
            parseMoney(incomeText);


        const total =
            parseMoney(totalText);


        /*
         * 基础有效性判断。
         */

        if (
            name &&
            !/^(status|orders|one day|7 days|income|total)$/i
                .test(name)
        ) {

            referrals.push({

                name,

                status,

                orders,

                oneDay,

                sevenDay,

                income,

                total
            });


            i += 7;

        } else {

            i++;
        }
    }


    return referrals;
}


/* =========================================================
   Snapshot
   ========================================================= */

function getLatestSnapshot(
    snapshots
) {

    if (!snapshots.length) {
        return null;
    }


    return [...snapshots]
        .sort(
            (a, b) =>
                a.date.localeCompare(b.date)
        )
        .at(-1);
}


function getPreviousSnapshot(
    snapshots,
    project,
    date
) {

    const previous =
        snapshots
            .filter(item =>
                item.project === project &&
                item.date < date
            )
            .sort(
                (a, b) =>
                    a.date.localeCompare(b.date)
            );


    if (!previous.length) {
        return null;
    }


    return previous[
        previous.length - 1
    ];
}


/* =========================================================
   核心：
   计算某个 Referral 当天新增
   ========================================================= */

function calculateDaily(
    currentReferral,
    previousReferral
) {

    if (!currentReferral) {

        return {
            orders: 0,
            revenue: 0
        };
    }


    const currentOrders =
        Number(
            currentReferral.orders || 0
        );


    const currentRevenue =
        Number(
            currentReferral.total || 0
        );


    const previousOrders =
        previousReferral
            ? Number(
                previousReferral.orders || 0
            )
            : 0;


    const previousRevenue =
        previousReferral
            ? Number(
                previousReferral.total || 0
            )
            : 0;


    let dailyOrders =
        currentOrders -
        previousOrders;


    let dailyRevenue =
        currentRevenue -
        previousRevenue;


    /*
     * 处理浮点误差。
     */

    if (
        Math.abs(dailyOrders) < 0.000001
    ) {

        dailyOrders = 0;
    }


    if (
        Math.abs(dailyRevenue) < 0.000001
    ) {

        dailyRevenue = 0;
    }


    return {

        orders: dailyOrders,

        revenue: dailyRevenue
    };
}


/* =========================================================
   获取某个 Referral 在某一天的新增
   ========================================================= */

function getReferralDaily(
    snapshot,
    referralName,
    snapshots
) {

    if (!snapshot) {

        return {
            orders: 0,
            revenue: 0
        };
    }


    const currentReferral =
        snapshot.referrals.find(
            item =>
                item.name === referralName
        );


    if (!currentReferral) {

        return {
            orders: 0,
            revenue: 0
        };
    }


    const previousSnapshot =
        getPreviousSnapshot(
            snapshots,
            snapshot.project,
            snapshot.date
        );


    const previousReferral =
        previousSnapshot?.referrals?.find(
            item =>
                item.name === referralName
        );


    return calculateDaily(
        currentReferral,
        previousReferral
    );
}

   Snapshot 每日总新增
   ========================================================= */

function getSnapshotDailyTotal(
    snapshot,
    snapshots
) {

    if (!snapshot) {

        return {
            revenue: 0,
            orders: 0
        };
    }


    const previousSnapshot =
        getPreviousSnapshot(
            snapshots,
            snapshot.project,
            snapshot.date
        );


    let revenue = 0;
    let orders = 0;


    snapshot.referrals.forEach(
        currentReferral => {

            const previousReferral =
                previousSnapshot?.referrals?.find(
                    item =>
                        item.name ===
                        currentReferral.name
                );


            const daily =
                calculateDaily(
                    currentReferral,
                    previousReferral
                );


            revenue +=
                daily.revenue;

            orders +=
                daily.orders;
        }
    );


    return {
        revenue,
        orders
    };
}

function importData() {

    const date =
        document.getElementById(
            "snapshotDate"
        ).value;


    const raw =
        document.getElementById(
            "rawData"
        ).value.trim();


    if (!date) {

        alert("请选择数据日期");

        return;
    }


    if (!raw) {

        alert("请粘贴 IGG Referral 数据");

        return;
    }


    const referrals =
        parseReferralText(raw);


    if (!referrals.length) {

        alert(
            "没有识别到有效 Referral 数据，请检查数据格式。"
        );

        return;
    }


    const snapshots =
        getSnapshots();


    const snapshot = {

        project: "default",

        date,

        referrals
    };


    /*
     * 如果当天已经存在，
     * 就直接覆盖。
     */

    const existingIndex =
        snapshots.findIndex(
            item =>
                item.project === "default" &&
                item.date === date
        );


    if (existingIndex >= 0) {

        snapshots[existingIndex] =
            snapshot;

    } else {

        snapshots.push(snapshot);
    }


    snapshots.sort(
        (a, b) =>
            a.date.localeCompare(b.date)
    );


    saveSnapshots(snapshots);


    renderAll();


    alert(
        `导入成功：${date}\n识别到 ${referrals.length} 个 Referral`
    );
}


/* =========================================================
   渠道数据
   ========================================================= */

function buildChannelData(
    latest,
    snapshots
) {

    const result = {};


    if (!latest) {
        return result;
    }


    const previousSnapshot =
        getPreviousSnapshot(
            snapshots,
            latest.project,
            latest.date
        );


    latest.referrals.forEach(
        item => {

            /*
             * 累计销售为 0：
             * 不显示。
             */

            if (
                Number(item.total || 0)
                === 0
            ) {

                return;
            }


            const channel =
                classifyChannel(
                    item.name
                );


            if (!result[channel]) {

                result[channel] = {

                    name: channel,

                    orders: 0,

                    revenue: 0,

                    dailyOrders: 0,

                    dailyRevenue: 0
                };
            }


            const previousReferral =
                previousSnapshot?.referrals?.find(
                    r =>
                        r.name === item.name
                );


            const daily =
                calculateDaily(
                    item,
                    previousReferral
                );


            result[channel].orders +=
                Number(
                    item.orders || 0
                );


            result[channel].revenue +=
                Number(
                    item.total || 0
                );


            result[channel].dailyOrders +=
                daily.orders;


            result[channel].dailyRevenue +=
                daily.revenue;
        }
    );


    /*
     * 最终再过滤一次。
     */

    Object.keys(result).forEach(
        channel => {

            if (
                result[channel].revenue
                === 0
            ) {

                delete result[channel];
            }
        }
    );


    return result;
}

/* =========================================================
   渠道每日新增
   ========================================================= */

function getChannelDailyData(
    snapshot,
    channelName,
    snapshots
) {

    if (!snapshot) {

        return {
            revenue: 0,
            orders: 0
        };
    }


    const previousSnapshot =
        getPreviousSnapshot(
            snapshots,
            snapshot.project,
            snapshot.date
        );


    let revenue = 0;
    let orders = 0;


    snapshot.referrals.forEach(
        currentReferral => {

            if (
                classifyChannel(
                    currentReferral.name
                ) !== channelName
            ) {

                return;
            }


            /*
             * 销售额为 0 的 Link 不参与。
             */

            if (
                Number(
                    currentReferral.total || 0
                ) === 0
            ) {

                return;
            }


            const previousReferral =
                previousSnapshot?.referrals?.find(
                    item =>
                        item.name ===
                        currentReferral.name
                );


            const daily =
                calculateDaily(
                    currentReferral,
                    previousReferral
                );


            revenue +=
                daily.revenue;


            orders +=
                daily.orders;
        }
    );


    if (
        Math.abs(revenue) < 0.000001
    ) {

        revenue = 0;
    }


    if (
        Math.abs(orders) < 0.000001
    ) {

        orders = 0;
    }


    return {
        revenue,
        orders
    };
}


/* =========================================================
   当前有效渠道
   ========================================================= */

function getActiveChannels(
    snapshots
) {

    const latest =
        getLatestSnapshot(
            snapshots
        );


    if (!latest) {
        return [];
    }


    const channels =
        new Set();


    latest.referrals.forEach(
        item => {

            /*
             * 只看最新数据有销售的渠道。
             */

            if (
                Number(item.total || 0)
                !== 0
            ) {

                channels.add(
                    classifyChannel(
                        item.name
                    )
                );
            }
        }
    );


    return Array.from(channels);
}

function renderReferrals(
    latest,
    snapshots
) {

    const head =

        );


    const body =
        document.getElementById(
            "referralDailyBody"
        );


    head.innerHTML = "";
    body.innerHTML = "";


    /*
     * 日期从早到晚。
     */

    const sorted =
        [...snapshots].sort(
            (a, b) =>
                a.date.localeCompare(b.date)
        );


    if (!sorted.length) {

        body.innerHTML = `
            <tr>
                <td class="empty">
                    暂无数据
                </td>
            </tr>
        `;

        return;
    }


    /*
     * 只显示最新快照中：
     * 累计销售额 > 0 的 Link。
     *
     * 这样没有带量的 Link 就不会一直占位置。
     */

    const activeReferrals =
        latest
            ? latest.referrals
                .filter(
                    item =>
                        Number(
                            item.total || 0
                        ) !== 0
                )
                .sort(
                    (a, b) =>
                        Number(
                            b.total || 0
                        ) -
                        Number(
                            a.total || 0
                        )
                )
            : [];


    if (!activeReferrals.length) {

        body.innerHTML = `
            <tr>
                <td
                    colspan="${1 + sorted.length}"
                    class="empty"
                >
                    暂无带量 Referral
                </td>
            </tr>
        `;

        return;
    }


    /*
     * =========================
     * 表头
     * =========================
     */

    let headerHtml = `
        <tr>
            <th>
                Link / 日期
            </th>
    `;


    sorted.forEach(
        snapshot => {

            const parts =
                snapshot.date.split("-");


            const shortDate =
                parts.length === 3
                    ? `${parts[1]}-${parts[2]}`
                    : snapshot.date;


            headerHtml += `
                <th>
                    <span class="referral-date">
                        ${escapeHtml(
                            shortDate
                        )}
                    </span>
                </th>
            `;
        }
    );


    headerHtml += `
        </tr>
    `;


    head.innerHTML =
        headerHtml;


    /*
     * =========================
     * 每一个 Referral 一行
     * =========================
     */

    activeReferrals.forEach(
        referral => {

            let rowHtml = `
                <tr>

                    <td>

                        <div
                            class="referral-name"
                            title="${escapeHtml(
                                referral.name
                            )}"
                        >
                            ${escapeHtml(
                                referral.name
                            )}
                        </div>

                    </td>
            `;


            sorted.forEach(
                (snapshot, index) => {

                    /*
                     * 当前快照中的 Link
                     */

                    const currentReferral =
                        snapshot.referrals.find(
                            item =>
                                item.name ===
                                referral.name
                        );


                    /*
                     * Link 当天不存在
                     *
                     * 直接显示 ·
                     */

                    if (!currentReferral) {

                        rowHtml += `
                            <td class="
                                referral-daily-zero
                            ">
                                ·
                            </td>
                        `;

                        return;
                    }


                    const currentRevenue =
                        Number(
                            currentReferral.total
                            || 0
                        );


                    /*
                     * 如果累计销售本身为 0，
                     * 不显示。
                     */

                    if (
                        currentRevenue === 0
                    ) {

                        rowHtml += `
                            <td class="
                                referral-daily-zero
                            ">
                                ·
                            </td>
                        `;

                        return;
                    }


                    /*
                     * =========================
                     * 第一个快照
                     * =========================
                     *
                     * 第一天没有上一份快照，
                     * 所以显示当时累计销售，
                     * 并标记 NEW。
                     */

                    if (index === 0) {

                        rowHtml += `
                            <td class="
                                referral-daily-positive
                                referral-new-cell
                                referral-new
                            ">
                                +${money(
                                    currentRevenue
                                )}
                            </td>
                        `;

                        return;
                    }


                    /*
                     * =========================
                     * 上一次快照
                     * =========================
                     */

                    const previousSnapshot =
                        sorted[index - 1];


                    const previousReferral =
                        previousSnapshot.referrals.find(
                            item =>
                                item.name ===
                                referral.name
                        );


                    /*
                     * 如果上一次没有这个 Link，
                     * 那么上一份累计销售视为 0。
                     */

                    const previousRevenue =
                        previousReferral
                            ? Number(
                                previousReferral.total
                                || 0
                            )
                            : 0;


                    /*
                     * =========================
                     * 核心计算
                     * =========================
                     *
                     * 今日累计
                     * -
                     * 上一次累计
                     *
                     * 例如：
                     *
                     * 9.4 = 10,000
                     * 9.5 = 10,000
                     *
                     * 10,000 - 10,000 = 0
                     */

                    let dailyRevenue =
                        currentRevenue -
                        previousRevenue;


                    /*
                     * 消除浮点误差。
                     */

                    if (
                        Math.abs(
                            dailyRevenue
                        ) < 0.000001
                    ) {

                        dailyRevenue = 0;
                    }


                    /*
                     * =========================
                     * 没有变化
                     * =========================
                     */

                    if (
                        dailyRevenue === 0
                    ) {

                        rowHtml += `
                            <td class="
                                referral-daily-zero
                            ">
                                ·
                            </td>
                        `;

                        return;
                    }


                    /*
                     * =========================
                     * 新出现的 Link
                     * =========================
                     */

                    if (
                        !previousReferral &&
                        dailyRevenue > 0
                    ) {

                        rowHtml += `
                            <td class="
                                referral-daily-positive
                                referral-new-cell
                                referral-new
                            ">
                                +${money(
                                    dailyRevenue
                                )}
                            </td>
                        `;

                        return;
                    }


                    /*
                     * =========================
                     * 正增长
                     * =========================
                     */

                    if (
                        dailyRevenue > 0
                    ) {

                        rowHtml += `
                            <td class="
                                referral-daily-positive
                            ">
                                +${money(
                                    dailyRevenue
                                )}
                            </td>
                        `;

                        return;
                    }


                    /*
                     * =========================
                     * 负增长
                     * =========================
                     *
                     * 如果 IGG 累计数据真的下降，
                     * 才显示负数。
                     */

                    rowHtml += `
                        <td class="
                            referral-daily-negative
                        ">
                            -$${Math.abs(
                                dailyRevenue
                            ).toLocaleString(
                                "en-US",
                                {
                                    minimumFractionDigits: 0,
                                    maximumFractionDigits: 2
                                }
                            )}
                        </td>
                    `;
                }
            );


            rowHtml += `
                </tr>
            `;


            body.innerHTML +=
                rowHtml;
        }
    );
}

}


function init() {

    document.getElementById(
        "snapshotDate"
    ).value =
        getLocalDateString();


    renderAll();
}


function renderAll() {

    const snapshots =
        getSnapshots();


    const latest =
        getLatestSnapshot(
            snapshots
        );


    renderStats();


    renderDailyBoard();


    renderChannels();


    renderDailyChannelTable(
        snapshots
    );


    renderReferrals(
        latest,
        snapshots
    );


    renderHistory();
}


init();

</script>

</body>
</html>
